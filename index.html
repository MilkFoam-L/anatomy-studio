<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Anatomy Studio</title>
    <meta name="description" content="Turn a concept into an interactive isometric machine with the open-source Anatomy skill, your own Claude API key and endpoint, entirely in the browser." />
    <script>
      try {
        var t = localStorage.getItem("anatomy-studio.theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
